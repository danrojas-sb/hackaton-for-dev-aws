<div class="carga-container">
  <h3>Cargar Facturas (CSV)</h3>

  <div class="upload-area">
    <label class="file-label">
      <input type="file" accept=".csv" (change)="onFileSelected($event)" hidden>
      <span class="file-btn">Seleccionar archivo CSV</span>
    </label>

    @if (fileName()) {
      <span class="file-name">{{ fileName() }}</span>
    }

    <button
      class="btn-cargar"
      (click)="cargar()"
      [disabled]="isLoading() || !fileName()">
      @if (isLoading()) {
        Cargando...
      } @else {
        Cargar facturas
      }
    </button>
  </div>

  @if (mensaje()) {
    <div class="mensaje" [class.error]="isError()" [class.success]="!isError()">
      {{ mensaje() }}
    </div>
  }
</div>
