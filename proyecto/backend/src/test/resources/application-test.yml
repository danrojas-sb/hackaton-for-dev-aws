spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

aws:
  region: us-east-1
  sqs:
    endpoint: http://localhost:4566
    queue:
      envio: facturas-envio
      respuesta: facturas-respuesta
