server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/centralizador
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  task:
    scheduling:
      pool:
        size: 2

aws:
  region: us-east-1
  sqs:
    endpoint: http://localhost:4566
    queue:
      envio: facturas-envio
      respuesta: facturas-respuesta
